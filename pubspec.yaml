name: escuela_caipi
description: Sistema de gestión escolar para padres y directora
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Supabase (Backend completo)
  supabase_flutter: ^2.5.6
  
  # Estado y navegación
  provider: ^6.1.2
  go_router: ^14.6.2
  
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  
  # Utilidades
  intl: ^0.19.0
  url_launcher: ^6.2.5
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  http: ^1.2.0
  qr_flutter: ^4.1.0
  
  # Notificaciones
  flutter_local_notifications: ^18.0.1
  excel: ^4.0.6
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  file_saver: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo_caipi.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_caipi.png"
  min_sdk_android: 21
